sqlalchemy.url = postgresql://voxledger_db_user:8MY90Yb2x5FkKeOfC2LXiZtrNh1dviku@dpg-dbg4g42vcj2c73b553ag-a.oregon-postgres.render.com/voxledger_db

[loggers]
